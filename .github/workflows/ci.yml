name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt && pip install -e . --no-deps
      - run: ruff check .
      - run: mypy
      # data/generated is not committed: build the (synthetic, seeded) data the app and tests read, then test.
      - run: python -m cloudspend.pipeline --mode local
      - run: pytest -m "not integration"
